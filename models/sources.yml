version: 2

sources:

  # ============================================================
  # ECOMMERCE (public schema)
  # ============================================================
  - name: ecommerce
    schema: public
    description: >
      Core transactional data. Customers, products, orders and
      order line items generated by the storefront.

    tables:
      - name: customers
        description: One row per registered customer.
        columns:
          - name: customer_id
            description: Primary key.
            tests:
              - unique
              - not_null
          - name: first_name
            description: Customer first name.
            tests:
              - not_null
          - name: last_name
            description: Customer last name.
            tests:
              - not_null
          - name: email
            description: Customer email address. Should be unique across all customers.
            tests:
              - unique
              - not_null
          - name: country
            description: Two or three letter country code.
            tests:
              - not_null
          - name: created_at
            description: Timestamp when the customer account was created.
            tests:
              - not_null

      - name: products
        description: One row per product in the catalogue.
        columns:
          - name: product_id
            description: Primary key.
            tests:
              - unique
              - not_null
          - name: name
            description: Product display name.
            tests:
              - not_null
          - name: category
            description: Product category grouping.
            tests:
              - not_null
              - accepted_values:
                  values: ['Footwear', 'Equipment', 'Nutrition', 'Accessories']
          - name: price
            description: Current listed price in GBP.
            tests:
              - not_null
          - name: created_at
            description: Timestamp when the product was added to the catalogue.
            tests:
              - not_null

      - name: orders
        description: One row per order placed by a customer.
        columns:
          - name: order_id
            description: Primary key.
            tests:
              - unique
              - not_null
          - name: customer_id
            description: Foreign key to customers.
            tests:
              - not_null
              - relationships:
                  to: source('ecommerce', 'customers')
                  field: customer_id
          - name: status
            description: Current fulfilment status of the order.
            tests:
              - not_null
              - accepted_values:
                  values: ['pending', 'shipped', 'delivered', 'returned']
          - name: created_at
            description: Timestamp when the order was placed.
            tests:
              - not_null

      - name: order_items
        description: One row per line item within an order.
        columns:
          - name: order_item_id
            description: Primary key.
            tests:
              - unique
              - not_null
          - name: order_id
            description: Foreign key to orders.
            tests:
              - not_null
              - relationships:
                  to: source('ecommerce', 'orders')
                  field: order_id
          - name: product_id
            description: Foreign key to products.
            tests:
              - not_null
              - relationships:
                  to: source('ecommerce', 'products')
                  field: product_id
          - name: quantity
            description: Number of units ordered.
            tests:
              - not_null
          - name: unit_price
            description: Price per unit at time of purchase in GBP.
            tests:
              - not_null


  # ============================================================
  # MARKETING
  # ============================================================
  - name: marketing
    schema: marketing
    description: >
      Paid and organic marketing data. Tracks campaigns, daily
      ad spend, leads generated, and conversions to customers.

    tables:
      - name: campaigns
        description: One row per marketing campaign.
        columns:
          - name: campaign_id
            description: Primary key.
            tests:
              - unique
              - not_null
          - name: name
            description: Human-readable campaign name.
            tests:
              - not_null
          - name: channel
            description: Acquisition channel the campaign ran on.
            tests:
              - not_null
              - accepted_values:
                  values: ['meta', 'google', 'email', 'organic']
          - name: budget
            description: Total allocated budget for the campaign in GBP.
            tests:
              - not_null
          - name: start_date
            description: Date the campaign launched.
            tests:
              - not_null
          - name: end_date
            description: Date the campaign ended. Null if still running.

      - name: ad_spend
        description: One row per campaign per day of recorded spend.
        columns:
          - name: spend_id
            description: Primary key.
            tests:
              - unique
              - not_null
          - name: campaign_id
            description: Foreign key to campaigns.
            tests:
              - not_null
              - relationships:
                  to: source('marketing', 'campaigns')
                  field: campaign_id
          - name: spend_date
            description: Date the spend was recorded.
            tests:
              - not_null
          - name: amount_spent
            description: Amount spent on this date in GBP.
            tests:
              - not_null
          - name: impressions
            description: Number of times the ad was shown.
            tests:
              - not_null
          - name: clicks
            description: Number of clicks recorded.
            tests:
              - not_null

      - name: leads
        description: >
          One row per lead captured via a campaign. A lead may or
          may not convert to a customer.
        columns:
          - name: lead_id
            description: Primary key.
            tests:
              - unique
              - not_null
          - name: email
            description: Email address submitted by the lead.
            tests:
              - not_null
          - name: campaign_id
            description: Foreign key to the campaign that generated the lead.
            tests:
              - not_null
              - relationships:
                  to: source('marketing', 'campaigns')
                  field: campaign_id
          - name: created_at
            description: Timestamp when the lead was captured.
            tests:
              - not_null

      - name: conversions
        description: >
          One row per lead that converted into a paying customer.
          Leads with no record here did not convert.
        columns:
          - name: conversion_id
            description: Primary key.
            tests:
              - unique
              - not_null
          - name: lead_id
            description: Foreign key to leads.
            tests:
              - unique
              - not_null
              - relationships:
                  to: source('marketing', 'leads')
                  field: lead_id
          - name: customer_id
            description: >
              The customer_id this lead converted to. References
              public.customers but FK is not enforced cross-schema.
            tests:
              - not_null
          - name: converted_at
            description: Timestamp when the conversion occurred.
            tests:
              - not_null


  # ============================================================
  # SUPPORT
  # ============================================================
  - name: support
    schema: support
    description: >
      Customer support operations data. Tracks tickets raised by
      customers, messages exchanged, agent assignments, and
      resolution outcomes.

    tables:
      - name: agents
        description: One row per support agent.
        columns:
          - name: agent_id
            description: Primary key.
            tests:
              - unique
              - not_null
          - name: name
            description: Agent display name.
            tests:
              - not_null
          - name: team
            description: The support tier the agent belongs to.
            tests:
              - not_null
              - accepted_values:
                  values: ['tier1', 'tier2', 'escalations']
          - name: joined_at
            description: Date the agent joined the support team.
            tests:
              - not_null

      - name: tickets
        description: >
          One row per support ticket. Tickets 7 and 8 are
          intentionally unresolved for SLA modelling.
        columns:
          - name: ticket_id
            description: Primary key.
            tests:
              - unique
              - not_null
          - name: customer_id
            description: >
              The customer who raised the ticket. References
              public.customers but FK is not enforced cross-schema.
            tests:
              - not_null
          - name: subject
            description: Short description of the issue.
            tests:
              - not_null
          - name: category
            description: Issue category used for routing and reporting.
            tests:
              - not_null
              - accepted_values:
                  values: ['delivery', 'returns', 'billing', 'product', 'other']
          - name: priority
            description: Ticket priority assigned at creation.
            tests:
              - not_null
              - accepted_values:
                  values: ['low', 'medium', 'high']
          - name: status
            description: Current status of the ticket.
            tests:
              - not_null
              - accepted_values:
                  values: ['open', 'pending', 'resolved', 'closed']
          - name: created_at
            description: Timestamp when the ticket was raised.
            tests:
              - not_null

      - name: ticket_messages
        description: One row per message sent within a support ticket thread.
        columns:
          - name: message_id
            description: Primary key.
            tests:
              - unique
              - not_null
          - name: ticket_id
            description: Foreign key to tickets.
            tests:
              - not_null
              - relationships:
                  to: source('support', 'tickets')
                  field: ticket_id
          - name: sender_type
            description: Whether the message was sent by the customer or an agent.
            tests:
              - not_null
              - accepted_values:
                  values: ['customer', 'agent']
          - name: message_text
            description: Full text of the message.
            tests:
              - not_null
          - name: sent_at
            description: Timestamp when the message was sent.
            tests:
              - not_null

      - name: ticket_assignments
        description: One row per agent assignment to a ticket.
        columns:
          - name: assignment_id
            description: Primary key.
            tests:
              - unique
              - not_null
          - name: ticket_id
            description: Foreign key to tickets.
            tests:
              - not_null
              - relationships:
                  to: source('support', 'tickets')
                  field: ticket_id
          - name: agent_id
            description: Foreign key to agents.
            tests:
              - not_null
              - relationships:
                  to: source('support', 'agents')
                  field: agent_id
          - name: assigned_at
            description: Timestamp when the agent was assigned.
            tests:
              - not_null

      - name: resolutions
        description: >
          One row per resolved ticket. Not all tickets have a
          resolution record — those without one are still open
          or pending.
        columns:
          - name: resolution_id
            description: Primary key.
            tests:
              - unique
              - not_null
          - name: ticket_id
            description: Foreign key to tickets. One resolution per ticket maximum.
            tests:
              - unique
              - not_null
              - relationships:
                  to: source('support', 'tickets')
                  field: ticket_id
          - name: resolved_by
            description: Foreign key to the agent who resolved the ticket.
            tests:
              - not_null
              - relationships:
                  to: source('support', 'agents')
                  field: agent_id
          - name: resolution_note
            description: Free text summary of how the ticket was resolved.
          - name: resolved_at
            description: Timestamp when the ticket was marked resolved.
            tests:
              - not_null